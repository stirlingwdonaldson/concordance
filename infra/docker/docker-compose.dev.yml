services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: concordance-postgres
    environment:
      POSTGRES_DB: concordance
      POSTGRES_USER: concordance
      POSTGRES_PASSWORD: concordance
    ports:
      - "54329:5432"
    volumes:
      - concordance-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concordance -d concordance"]
      interval: 5s
      timeout: 3s
      retries: 20

  tika:
    image: apache/tika:2.9.2.1
    container_name: concordance-tika
    ports:
      - "9998:9998"

volumes:
  concordance-pgdata:
